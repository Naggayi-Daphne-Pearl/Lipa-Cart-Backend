name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly scan every Monday 06:00 UTC to catch newly-disclosed issues in unchanged code.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/secrets \
            --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm audit is intentionally NOT in CI yet. The current dependency tree has
  # pre-existing high/critical vulns inherited from Strapi 5.33.4 (serialize-javascript,
  # undici, tar, tmp). Some need a Strapi 5.42.0 upgrade to resolve, which is a
  # runtime-affecting change that deserves its own focused PR. Dependabot will still
  # track and propose updates for all deps. Re-enable `npm audit` as a blocking job
  # after the Strapi upgrade lands and the baseline is clean.

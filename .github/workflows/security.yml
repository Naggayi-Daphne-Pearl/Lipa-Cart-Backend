name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly scan every Monday 06:00 UTC to catch newly-disclosed issues in unchanged code.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  # gitleaks-action needs pull_requests: read to list commits on PR events;
  # without it the action returns 403 "Resource not accessible by integration".
  pull-requests: read
  # CodeQL's upload-sarif (used by the Semgrep job) reads workflow-run metadata
  # for telemetry; without `actions: read` it emits "Resource not accessible by
  # integration" warnings on every run.
  actions: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Pinned to a specific Semgrep release for supply-chain safety.
      # Dependabot tracks container updates via the `semgrep/semgrep` image.
      image: semgrep/semgrep:1.157.0
    steps:
      - name: Checkout
        # actions/checkout v4 — SHA-pinned; Dependabot will update.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Phase 1: `continue-on-error` lets findings surface as a visible red step
      # without blocking the PR while the baseline is cleaned up. Unlike `|| true`,
      # this preserves the real exit code so internal Semgrep errors (exit 2) and
      # auth failures (exit 13) are still clearly visible in the step status.
      # Flip to `false` once the baseline is clean — see CONTRIBUTING.md.
      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/secrets \
            --sarif --output=semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        # github/codeql-action/upload-sarif v3 — SHA-pinned.
        uses: github/codeql-action/upload-sarif@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v4 — SHA-pinned.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks/gitleaks-action v2 — SHA-pinned.
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm audit is intentionally NOT in CI yet. The current dependency tree has
  # pre-existing high/critical vulns inherited from Strapi 5.33.4 (serialize-javascript,
  # undici, tar, tmp). Some need a Strapi 5.42.0 upgrade to resolve, which is a
  # runtime-affecting change that deserves its own focused PR. Dependabot will still
  # track and propose updates for all deps. Re-enable `npm audit` as a blocking job
  # after the Strapi upgrade lands and the baseline is clean.
